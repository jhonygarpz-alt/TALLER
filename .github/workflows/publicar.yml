name: Publicar TallerPro en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      BASE_PATH: /${{ github.event.repository.name }}/
      # Datos públicos del proyecto Supabase (la clave publicable no es un secreto;
      # la seguridad la aplican las reglas RLS de la base de datos).
      VITE_SUPABASE_URL: https://avzpgberhkiyyhszsymj.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_qaCrBHiCPLl2s3tXQeQPcA_dNpMGIZ2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build
      # Permite abrir directamente rutas internas (p. ej. /vehiculos) en GitHub Pages
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
